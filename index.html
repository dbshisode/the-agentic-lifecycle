        // ==========================================
        // ⚙️ APP LOGIC (Do not edit below unless you know JS)
        // ==========================================

        // State variables
        let currentChapterIndex = 0;
        let isSidebarOpen = false;
        let isDarkMode = false;
        let fontSize = 20; // Default font size in px

        // DOM Elements
        const DOM = {
            html: document.documentElement,
            bookTitle: document.getElementById('book-title'),
            chapterTitle: document.getElementById('chapter-title'),
            chapterContent: document.getElementById('chapter-content'),
            tocList: document.getElementById('toc-list'),
            prevBtn: document.getElementById('prev-btn'),
            nextBtn: document.getElementById('next-btn'),
            progress: document.getElementById('chapter-progress'),
            menuBtn: document.getElementById('menu-btn'),
            closeSidebarBtn: document.getElementById('close-sidebar-btn'),
            sidebar: document.getElementById('sidebar'),
            sidebarOverlay: document.getElementById('sidebar-overlay'),
            themeBtn: document.getElementById('theme-btn'),
            incFontBtn: document.getElementById('increase-font-btn'),
            decFontBtn: document.getElementById('decrease-font-btn'),
            mainContent: document.getElementById('main-content')
        };

        // Initialize App
        function init() {
            DOM.bookTitle.textContent = myBook.title;
            document.title = myBook.title;
            
            loadSettings();
            buildTOC();
            renderChapter(currentChapterIndex);
            applySettings();
            
            // Handle missing images in the preview environment
            document.addEventListener('error', function(e) {
                if (e.target.tagName.toLowerCase() === 'img') {
                    const originalSrc = e.target.getAttribute('src');
                    // Only replace local image links that fail to load
                    if (originalSrc && !originalSrc.startsWith('http')) {
                        e.target.src = `https://placehold.co/600x400/e2e8f0/475569?text=Image+Will+Load+On+GitHub\\n(${originalSrc})`;
                        e.target.classList.add('border-dashed', 'border-2', 'border-gray-400');
                    }
                }
            }, true);

            // Event Listeners
            DOM.prevBtn.addEventListener('click', () => changeChapter(-1));
            DOM.nextBtn.addEventListener('click', () => changeChapter(1));
            
            DOM.menuBtn.addEventListener('click', toggleSidebar);
            DOM.closeSidebarBtn.addEventListener('click', toggleSidebar);
            DOM.sidebarOverlay.addEventListener('click', toggleSidebar);
            
            DOM.themeBtn.addEventListener('click', toggleTheme);
            DOM.incFontBtn.addEventListener('click', () => adjustFontSize(2));
            DOM.decFontBtn.addEventListener('click', () => adjustFontSize(-2));

            // Setup responsive sidebar behavior
            window.addEventListener('resize', handleResize);
            handleResize();
        }

        // Build Table of Contents
        function buildTOC() {
            DOM.tocList.innerHTML = '';
            myBook.chapters.forEach((chapter, index) => {
                const li = document.createElement('li');
                const btn = document.createElement('button');
                
                btn.className = `w-full text-left px-4 py-3 rounded-lg transition-colors duration-200 ${
                    index === currentChapterIndex 
                    ? 'bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300 font-semibold' 
                    : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800'
                }`;
                btn.textContent = chapter.title;
                btn.onclick = () => {
                    renderChapter(index);
                    if (window.innerWidth < 768) toggleSidebar();
                };
                
                li.appendChild(btn);
                DOM.tocList.appendChild(li);
            });
        }

        // Render a Chapter
        function renderChapter(index) {
            if (index < 0 || index >= myBook.chapters.length) return;
            
            currentChapterIndex = index;
            const chapter = myBook.chapters[index];
            
            // Handle Cover visibility
            const headerEl = document.querySelector('article > header');
            if (chapter.isCover) {
                headerEl.style.display = 'none';
            } else {
                headerEl.style.display = 'block';
            }

            // Update DOM
            DOM.chapterTitle.textContent = chapter.title;
            DOM.chapterContent.innerHTML = chapter.content;
            DOM.progress.textContent = `Chapter ${index + 1} of ${myBook.chapters.length}`;

            // Update Buttons
            DOM.prevBtn.disabled = index === 0;
            DOM.nextBtn.disabled = index === myBook.chapters.length - 1;
            
            // Update TOC highlighting
            buildTOC();
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // Save Progress
            saveSettings();
        }

        // Navigation
        function changeChapter(direction) {
            renderChapter(currentChapterIndex + direction);
        }

        // Sidebar Controls
        function toggleSidebar() {
            isSidebarOpen = !isSidebarOpen;
            if (isSidebarOpen) {
                DOM.sidebar.classList.remove('-translate-x-full');
                DOM.sidebarOverlay.classList.remove('hidden');
                // Small delay to allow display:block to apply before opacity transition
                setTimeout(() => DOM.sidebarOverlay.classList.add('opacity-100'), 10);
            } else {
                if (window.innerWidth < 768) {
                    DOM.sidebar.classList.add('-translate-x-full');
                    DOM.sidebarOverlay.classList.remove('opacity-100');
                    setTimeout(() => DOM.sidebarOverlay.classList.add('hidden'), 300);
                }
            }
        }

        function handleResize() {
            if (window.innerWidth >= 768) { // md breakpoint in Tailwind
                DOM.sidebar.classList.remove('-translate-x-full');
                DOM.sidebarOverlay.classList.add('hidden');
                DOM.mainContent.classList.add('md:ml-72');
                isSidebarOpen = true;
            } else {
                DOM.sidebar.classList.add('-translate-x-full');
                DOM.mainContent.classList.remove('md:ml-72');
                isSidebarOpen = false;
            }
        }

        // Theme Controls
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            applySettings();
            saveSettings();
        }

        // Font Size Controls
        function adjustFontSize(change) {
            const newSize = fontSize + change;
            if (newSize >= 14 && newSize <= 32) {
                fontSize = newSize;
                applySettings();
                saveSettings();
            }
        }

        // Apply visual settings to DOM
        function applySettings() {
            // Theme
            if (isDarkMode) {
                DOM.html.classList.add('dark');
            } else {
                DOM.html.classList.remove('dark');
            }
            
            // Font Size
            DOM.chapterContent.style.fontSize = `${fontSize}px`;
        }

        // Local Storage Management
        function saveSettings() {
            const settings = {
                chapter: currentChapterIndex,
                theme: isDarkMode,
                fontSize: fontSize
            };
            localStorage.setItem(`bookReader_${myBook.title.replace(/\s+/g, '')}`, JSON.stringify(settings));
        }

        function loadSettings() {
            const saved = localStorage.getItem(`bookReader_${myBook.title.replace(/\s+/g, '')}`);
            if (saved) {
                try {
                    const settings = JSON.parse(saved);
                    currentChapterIndex = settings.chapter || 0;
                    
                    // Use saved theme preference
                    if (settings.theme !== undefined) {
                        isDarkMode = settings.theme;
                    }
                    
                    fontSize = settings.fontSize || 20;
                } catch (e) {
                    console.error("Could not load settings", e);
                }
            }
            // Removed OS preference check. isDarkMode is naturally false, so it defaults to light mode.
        }

        // Start App
        window.addEventListener('DOMContentLoaded', init);

    </script>
